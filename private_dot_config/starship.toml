"$schema" = 'https://starship.rs/config-schema.json'

# Starship defaults, with three exceptions: the path contracts like p10k, the
# git status keeps p10k's per-kind counts and colours, and the AWS symbol is a
# globe. Everything else (format, add_newline, module symbols) is the default.

# Keep the last `truncation_length` folders whole and shrink the parents to one
# letter each. Raise the number to keep more folders whole.
[directory]
truncate_to_repo = false
truncation_length = 4
fish_style_pwd_dir_length = 1

# Each kind of change gets its own colour and count instead of the default
# single red "[!?]" block.
[git_status]
format = '([$ahead_behind$stashed$conflicted$staged$renamed$deleted$modified$untracked]($style))'
style = ''
ahead = '[⇡$count](green) '
behind = '[⇣$count](green) '
diverged = '[⇣$behind_count⇡$ahead_count](green) '
stashed = '[*$count](green) '
conflicted = '[~$count](red) '
staged = '[+$count](yellow) '
renamed = '[»$count](yellow) '
deleted = '[✘$count](yellow) '
modified = '[!$count](yellow) '
untracked = '[?$count](blue) '

# Lines added and removed in the working tree.
[git_metrics]
disabled = false

# Not the default ☁️: zsh counts it as one cell and Ghostty draws it as two only
# when grapheme clustering (mode 2027) is on, so the prompt spacing drifts. 🌐
# is a wide emoji in its own right and both agree on two cells.
[aws]
symbol = '🌐 '
