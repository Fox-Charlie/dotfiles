"$schema" = 'https://starship.rs/config-schema.json'

# An explicit format names every segment, so nothing appears unless listed here.
# Line 1: who/where/git. Line 2: prompt character. The p10k "right prompt"
# segments render on the right of the input line through right_format, and zsh
# hides them when the typed command reaches them.
format = """
($username$hostname )$directory$git_branch$git_commit$git_state$git_status$git_metrics
$character"""

right_format = '$status$cmd_duration$jobs$python$nodejs$terraform$kubernetes$aws'

add_newline = false

# Every style below names an ANSI colour 0-7, so the terminal theme supplies the
# actual hue. Nothing is bold: bold makes most terminals substitute the bright
# variant, which leaves the theme behind. The palette matches the retired p10k
# config: green for clean facts, yellow for changes, blue for untracked, red for
# trouble, and the terminal default for punctuation.

# Starship shows the user only for root or over ssh, and the host only over ssh,
# which is what the p10k context segment did.
[username]
format = '[$user]($style)'
style_user = 'white'
style_root = 'red'

[hostname]
format = '[@$hostname]($style)'
style = 'white'

# p10k showed the whole path and shrank the parents to one letter each. Starship
# keeps the last `truncation_length` folders whole and applies the same one
# letter treatment above them. Raise the number to keep more folders whole.
[directory]
truncate_to_repo = false
truncation_length = 4
fish_style_pwd_dir_length = 1
style = 'blue'
read_only = ' 󰌾'
read_only_style = 'red'

# The git segments each carry a leading space, so a clean repo shows no
# trailing whitespace after the branch.
[git_branch]
format = '[$symbol$branch]($style)([:]()[$remote_branch]($style))'
truncation_length = 32
truncation_symbol = '…'
style = 'green'

[git_commit]
format = '[ @]()[$hash$tag]($style)'
tag_disabled = false
tag_symbol = ' #'
commit_hash_length = 8
style = 'green'

[git_state]
format = '[ $state( $progress_current/$progress_total)]($style)'
style = 'red'

[git_status]
format = '([$ahead_behind$stashed$conflicted$staged$renamed$deleted$modified$untracked]($style))'
style = ''
ahead = '[ ⇡$count](green)'
behind = '[ ⇣$count](green)'
diverged = '[ ⇣$behind_count⇡$ahead_count](green)'
stashed = '[ *$count](green)'
conflicted = '[ ~$count](red)'
staged = '[ +$count](yellow)'
renamed = '[ »$count](yellow)'
deleted = '[ ✘$count](yellow)'
modified = '[ !$count](yellow)'
untracked = '[ ?$count](blue)'

# ❮ needs zsh-vi-mode sourced before `starship init zsh`, so starship can wrap
# its keymap widget.
# Lines added and removed in the working tree. p10k had no equivalent.
[git_metrics]
disabled = false
format = "([ +$added]($added_style))([ -$deleted]($deleted_style))"
added_style = "green"
deleted_style = "red"

[character]
success_symbol = '[❯](green)'
error_symbol = '[❯](red)'
vimcmd_symbol = '[❮](green)'

[status]
disabled = false
format = '[$symbol$status( $signal_name)]($style) '
symbol = '✘ '
style = 'red'
pipestatus = true
pipestatus_separator = '|'
pipestatus_format = '[✘ $pipestatus]($style) '
pipestatus_segment_format = '$status'

[cmd_duration]
min_time = 3_000
format = '[$duration]($style) '
style = 'yellow'

[jobs]
format = '[$symbol]($style) '
symbol = '✦'
style = 'red'

[python]
format = '[${symbol}(${version} )(\($virtualenv\) )]($style)'
symbol = '🐍 '
version_format = '${raw}'
style = 'cyan'

[nodejs]
format = '[$symbol($version )]($style)'
symbol = '⬢ '
version_format = '${raw}'
style = 'green'

# Workspace only: `$version` would run `terraform version` on every prompt.
[terraform]
format = '[$symbol$workspace]($style) '
symbol = '💠 '
style = 'blue'

# p10k showed the context only while typing a kubectl command. Starship cannot
# do that, so the nearest match is to show it only in kubernetes-looking folders.
# Remove the detect_* lines to show the context everywhere.
[kubernetes]
disabled = false
format = '[$symbol$context( \($namespace\))]($style) '
symbol = '☸ '
style = 'magenta'
detect_files = ['Chart.yaml', 'kustomization.yaml', 'skaffold.yaml']
detect_folders = ['k8s', 'kubernetes', 'helm', 'charts']

# force_display shows AWS_PROFILE even when no credentials file exists.
[aws]
format = '[$symbol$profile( $region)]($style) '
symbol = '☁️ '
style = 'yellow'
force_display = true
